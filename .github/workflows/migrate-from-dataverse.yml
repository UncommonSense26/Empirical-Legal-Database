name: Migrate from Harvard Dataverse

on:
  workflow_dispatch:
    inputs:
      doi:
        description: "Dataverse DOI (e.g. doi:10.7910/DVN/XXXXXX)"
        required: true

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download dataset and generate citation files
        env:
          DATAVERSE_API_TOKEN: ${{ secrets.DATAVERSE_API_TOKEN }}
        run: python scripts/migrate_from_dataverse.py "${{ inputs.doi }}"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "Import dataset ${{ inputs.doi }} from Harvard Dataverse" || echo "Nothing to commit"
          git push
